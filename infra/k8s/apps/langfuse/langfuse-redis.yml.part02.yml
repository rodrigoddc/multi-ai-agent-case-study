apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: langfuse-redis
  namespace: multi-agents
  labels:
    app.kubernetes.io/name: langfuse
    app.kubernetes.io/component: redis
spec:
  serviceName: langfuse-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: langfuse
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langfuse
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: docker.io/redis:7
          args:
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
            - "--maxmemory-policy"
            - "noeviction"
          ports:
            - containerPort: 6379
              name: redis
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: redis-auth
          volumeMounts:
            - name: redis-data
              mountPath: /data
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 3
            timeoutSeconds: 5
            failureThreshold: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 3
            timeoutSeconds: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: langfuse-redis-pvc
