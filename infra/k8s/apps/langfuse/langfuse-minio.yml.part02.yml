apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: langfuse-minio
  namespace: multi-agents
  labels:
    app.kubernetes.io/name: langfuse
    app.kubernetes.io/component: minio
spec:
  serviceName: langfuse-minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: langfuse
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langfuse
        app.kubernetes.io/component: minio
    spec:
      containers:
        - name: minio
          image: cgr.dev/chainguard/minio
          command: ["sh"]
          args:
            - -c
            - "mkdir -p /data/langfuse && minio server --address \":9000\" --console-address \":9001\" /data"
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: minio-root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: minio-root-password
          volumeMounts:
            - name: minio-data
              mountPath: /data
          livenessProbe:
            exec:
              command:
                - mc
                - ready
                - local
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - mc
                - ready
                - local
            initialDelaySeconds: 5
            periodSeconds: 3
            timeoutSeconds: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: langfuse-minio-pvc
