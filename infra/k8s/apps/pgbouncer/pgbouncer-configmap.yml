apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: multi-agents
data:
  pgbouncer.ini: |
    [databases]
    hotelsdb = host=postgres-svc port=5432 dbname=hotelsdb

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 5432
    auth_type = md5
    auth_file = /etc/pgbouncer/userlist.txt
    pool_mode = transaction
    max_client_conn = 100
    default_pool_size = 20
    min_pool_size = 5
    reserve_pool_size = 5
    server_tls_sslmode = disable
    ignore_startup_parameters = extra_float_digits,options
    admin_users = hoteluser
    stats_users = hoteluser
