<!-- User Message -->
<div class="chat-message flex items-start space-x-3 justify-end">
    <div class="bg-blue-600 text-white rounded-2xl px-4 py-3 max-w-3xl shadow-sm">
        <p class="whitespace-pre-wrap">{{ user_message }}</p>
    </div>
    <div class="w-8 h-8 bg-gray-300 rounded-full flex items-center justify-center flex-shrink-0">
        <svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
    </div>
</div>

<!-- AI response message (workflow + answer combined) -->
<div class="chat-message flex items-start space-x-3">
    <div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-purple-600 rounded-full flex items-center justify-center flex-shrink-0">
        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path>
        </svg>
    </div>
    <div class="chat-response-card bg-white border border-slate-200 rounded-2xl px-4 py-3 max-w-3xl shadow-sm"
         hx-ext="sse"
         hx-swap="beforeend scroll:#{{ target_id|default('chat-messages') }}:bottom focus-scroll:true"
         sse-connect="/insights/chat/stream?message_id={{ message_id|urlencode }}&thread_id={{ thread_id|urlencode }}&query={{ user_message|urlencode }}&target_id={{ target_id|default('chat-messages')|urlencode }}&thread_input_id={{ thread_input_id|default('thread-id')|urlencode }}&user_id={{ user_id|urlencode }}&session_id={{ session_id|urlencode }}{% if display_name %}&display_name={{ display_name|urlencode }}{% endif %}"
         sse-close="done">
        <!-- Collapsible workflow (native HTML details/summary, no JS) -->
        <details id="chat-workflow-{{ message_id }}" class="chat-workflow-details" open>
            <summary class="chat-workflow-summary flex items-center justify-between cursor-pointer select-none">
                <span class="chat-response-title font-medium text-slate-700">AI agent workflow</span>
                <svg class="w-4 h-4 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
            </summary>
            <div class="chat-workflow-content mt-3">
                <div id="chat-progress-summary-{{ message_id }}"
                     class="chat-progress-summary mb-3"
                     sse-swap="ChatStatus"
                     hx-swap="innerHTML">
                    <span class="chat-progress-summary-label">Starting assistant workflow</span>
                    <div class="dot-pulse flex space-x-1" aria-label="Assistant workflow is running">
                        <span class="w-1.5 h-1.5 bg-gray-400 rounded-full"></span>
                        <span class="w-1.5 h-1.5 bg-gray-400 rounded-full"></span>
                        <span class="w-1.5 h-1.5 bg-gray-400 rounded-full"></span>
                    </div>
                </div>
                <ol id="chat-run-completed-steps-{{ message_id }}"
                    class="chat-run-steps chat-timeline space-y-2"
                    sse-swap="ChatCompletedStep"
                    hx-swap="beforeend scroll:#{{ target_id|default('chat-messages') }}:bottom focus-scroll:true">
                </ol>
                <div id="chat-active-step-slot-{{ message_id }}"
                     class="chat-active-step-slot"
                     sse-swap="ChatActiveStep"
                     hx-swap="innerHTML scroll:#{{ target_id|default('chat-messages') }}:bottom focus-scroll:true">
                </div>
            </div>
        </details>

        <!-- Final answer area (populated by ChatFinal event) -->
        <div id="chat-final-answer-{{ message_id }}"
             class="chat-final-answer mt-4 pt-4 border-t border-slate-100"
             sse-swap="ChatFinal"
             hx-swap="innerHTML scroll:#chat-messages:bottom focus-scroll:true">
        </div>
    </div>
</div>

<input type="hidden" id="{{ thread_input_id|default('thread-id') }}" name="thread_id" value="{{ thread_id }}" hx-swap-oob="true">
