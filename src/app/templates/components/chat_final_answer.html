{% if is_clarification and clarifying_question %}
<div class="chat-final-answer-clarification">
    <p class="text-gray-700 mb-3">{{ clarifying_question }}</p>
    {% if options %}
    <div class="flex flex-wrap gap-2">
        {% for option in options %}
        <button type="submit"
                name="message"
                value="{{ option }}"
                hx-post="/insights/chat"
                hx-target="#{{ target_id|default('chat-messages') }}"
                hx-swap="beforeend scroll:#{{ target_id|default('chat-messages') }}:bottom focus-scroll:true"
                hx-include="#{{ thread_input_id|default('thread-id') }}"
                class="px-4 py-2 bg-blue-100 hover:bg-blue-200 text-blue-800 rounded-lg text-sm font-medium transition-colors">
            {{ option }}
        </button>
        {% endfor %}
    </div>
    {% else %}
    <p class="text-sm text-gray-500">Please type your answer below.</p>
    {% endif %}
</div>
{% else %}
<div class="chat-final-answer-content">
    <div class="streaming-response streaming-response-complete">
        {% include 'components/insight_response.html' %}
    </div>
</div>
{% endif %}
<input type="hidden" id="{{ thread_input_id|default('thread-id') }}" name="thread_id" value="{{ thread_id }}">
